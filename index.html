<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KnoxWorks</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      padding: 60px 20px;
      max-width: 900px;
      margin-inline: auto;
    }

    h1 {
      font-size: 70px;
      margin-bottom: 10px;
    }

    p {
      color: #aeb8d0;
      font-size: 20px;
    }

    .links {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    a {
      display: block;
      padding: 20px;
      border: 1px solid #334;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-size: 28px;
      transition: 0.2s;
      background: #11182d;
    }

    a:hover {
      transform: translateX(10px);
      background: #17213d;
    }

    small {
      display: block;
      font-size: 15px;
      color: #8290b3;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <h1>KNOXWORKS</h1>

  <p>
    Games, websites, experiments and random stuff I make.
  </p>

  <div class="links">

    <a href="https://funminigames.base44.app" target="_blank">
      Fun Mini Games
      <small>Play a collection of browser games</small>
    </a>

    <a href="https://playflappy.lovable.app" target="_blank">
      Flappy Arcade
      <small>My Flappy-style arcade game</small>
    </a>

    <a href="https://knoxknoxy827.wixsite.com/knoxworks" target="_blank">
      KnoxWorks
      <small>My main KnoxWorks website</small>
    </a>

  </div>

</body>
</html>
